# Site do Diagnóstico GGDP. __DOMINIO__ e __PORTA__ são substituídos pelo instalar.sh.
# O Certbot (certbot --nginx) acrescenta o bloco HTTPS e o redirecionamento automaticamente.

# Limites contra abuso: envio de respostas e tentativas de token no admin.
# Chave vazia = sem limite: só os POST de envio entram na zona ggdp_envio.
map $request_method $ggdp_envio_chave {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $ggdp_envio_chave zone=ggdp_envio:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ggdp_admin:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    root /opt/form-duvidas/app/frontend/dist;
    index index.html;

    client_max_body_size 64k;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    access_log /var/log/nginx/form-duvidas.access.log;
    error_log  /var/log/nginx/form-duvidas.error.log;

    # Arquivos do build têm hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /api/respostas {
        limit_req zone=ggdp_envio burst=5 nodelay;   # POST (envio)
        limit_req zone=ggdp_admin burst=10 nodelay;  # GET (listagem do admin)
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORTA__;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/(admin/|respostas) {
        limit_req zone=ggdp_admin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORTA__;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__PORTA__;
        include /etc/nginx/proxy_params;
    }

    # SPA: qualquer outra rota (/, /admin, /obrigado) devolve o index.html, sem cache.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
